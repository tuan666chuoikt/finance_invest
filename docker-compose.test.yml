# Isolated testing stack (tester.md section 8). Never touch project finvest-live / gw-app@finance_invest.
# Use: docker compose -p finvest-test -f docker-compose.yml -f docker-compose.test.yml up -d
# !override replaces the base ports instead of appending (so 8080/8001/55432 are not published).
services:
  db:
    ports: !override
      - "127.0.0.1:15432:5432"
    volumes: !override
      - ./data-test/pg:/var/lib/postgresql/data
  api:
    ports: !override
      - "127.0.0.1:18001:8000"
    volumes: !override
      - ./data-test:/app/data
  web:
    ports: !override
      - "127.0.0.1:18080:80"
  crawler:
    volumes: !override
      - ./data-test:/app/data
