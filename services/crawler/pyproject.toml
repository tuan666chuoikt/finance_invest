[project]
name = "finvest-crawler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["finvest-market-data", "finvest-rules", "pydantic-settings>=2", "httpx>=0.27", "tzdata"]

[project.scripts]
finvest-crawl = "finvest_crawler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finvest_crawler"]

[tool.uv.sources]
finvest-rules = { workspace = true }
