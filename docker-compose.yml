# Only web (8080) and api (8001) are published, and only on loopback (ADR-S-001, system.md section 5).
# 8000 is the sponsor's gateway, not ours.
x-app-env: &app-env
  FINVEST_DATABASE_URL: postgresql+psycopg://finvest:${POSTGRES_PASSWORD:?copy .env.example to .env}@db:5432/finvest
  HOME: /tmp  # non-root user has no writable home

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: finvest
      POSTGRES_DB: finvest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U finvest -d finvest"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: finvest-app:local
    user: "${FINVEST_UID:-1000}:${FINVEST_GID:-1000}"
    command: sh -c "alembic -c apps/api/alembic.ini upgrade head && uvicorn finvest_api.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *app-env
      FINVEST_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  crawler:
    build: .
    image: finvest-app:local
    profiles: ["tools"]
    user: "${FINVEST_UID:-1000}:${FINVEST_GID:-1000}"
    entrypoint: ["finvest-crawl"]
    environment:
      <<: *app-env
      FINVEST_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
