[project]
name = "finvest-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["finvest-market-data", "fastapi>=0.110", "sqlalchemy>=2", "psycopg[binary]>=3.1", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finvest_api"]
