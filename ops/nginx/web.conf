server {
    listen 80;
    root /usr/share/nginx/html;

    # same-origin proxy: the browser never talks to the api port directly (platform.md 2.5)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
